[project]
name = "universal-web-agent"
version = "0.1.0"
description = "Mobile-first general-purpose web agent runtime."
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.116.0,<1",
  "uvicorn[standard]>=0.35.0,<1",
  "pydantic>=2.11.0,<3",
  "pydantic-settings>=2.10.0,<3",
  "python-dotenv>=1.1.0,<2",
  "browser-use>=0.11.0,<1",
  "playwright>=1.55.0,<2",
  "google-genai>=2.7.0,<3",
  "anthropic>=0.69.0,<1",
  "openai>=1.107.0,<2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0,<9",
  "pytest-asyncio>=1.1.0,<2",
  "httpx>=0.28.0,<1",
  "ruff>=0.13.0,<1"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
