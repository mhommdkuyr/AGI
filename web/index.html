<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<link rel="manifest" href="/web/manifest.webmanifest">
<title>وكيل — تنفيذ المهام على الويب</title>
<style>
:root{--bg:#07090d;--panel:#11151c;--panel2:#171c25;--line:#242b36;--text:#f7f8fa;--muted:#9aa4b2;--blue:#4da3ff;--blue2:#1677ff;--green:#35d07f;--amber:#ffb84d;--red:#ff6577;--r:22px}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -20%,#182337 0,#07090d 45%);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea{font:inherit}button{cursor:pointer}.shell{max-width:520px;margin:auto;min-height:100vh;padding:18px 16px 98px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 20px}.brand{font-size:20px;font-weight:800;letter-spacing:-.4px}.plus{background:#26394d;border:1px solid #3c5870;color:#62b2ff;border-radius:999px;padding:9px 15px;font-weight:800}.icon{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#151a22;color:#fff;display:grid;place-items:center;font-size:20px}.hero{padding:4px 2px 18px}.hero h1{font-size:32px;line-height:1.15;margin:0 0 8px;letter-spacing:-1px}.hero p{color:var(--muted);margin:0;line-height:1.6}.card{background:linear-gradient(180deg,#131820,#0f131a);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0;box-shadow:0 16px 50px #0005}.label{color:#cbd3df;font-size:13px;font-weight:700;margin-bottom:8px}.taskbox{min-height:126px;width:100%;resize:none;background:#0a0d12;border:1px solid #2a313d;border-radius:17px;color:#fff;padding:15px;outline:none}.taskbox:focus{border-color:#3e8de8;box-shadow:0 0 0 3px #3e8de822}.row{display:flex;gap:10px}.budget{flex:1;background:#0a0d12;border:1px solid #2a313d;color:#fff;border-radius:14px;padding:12px}.primary{width:100%;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;border:0;border-radius:16px;padding:14px;font-weight:850;margin-top:10px}.ghost{background:#171c24;border:1px solid #2a313d;color:#fff;border-radius:14px;padding:12px 15px}.live{overflow:hidden;padding:0}.live-head{padding:15px 16px;display:flex;justify-content:space-between;align-items:center}.status{display:flex;align-items:center;gap:7px;color:#cdd5df;font-size:13px}.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 14px var(--green)}.screen-wrap{background:#050608;border-top:1px solid var(--line);position:relative}.screen{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:#080a0e}.screen-empty{position:absolute;inset:0;display:grid;place-items:center;color:#6f7987}.timeline{padding:12px 16px}.step{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #1e242d}.step:last-child{border:0}.num{width:24px;height:24px;border-radius:50%;background:#1b2737;color:#73b7ff;display:grid;place-items:center;font-size:12px;font-weight:800}.step small{color:var(--muted)}.warn{background:#2b2114;border:1px solid #5d431e;color:#ffd38a;border-radius:16px;padding:13px;margin:12px 0;line-height:1.55}.result{background:#0d1f17;border:1px solid #1f6042;color:#baf3d3;border-radius:16px;padding:13px;white-space:pre-wrap}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);background:#0b0e13eF;backdrop-filter:blur(18px);border-top:1px solid #252c36;display:grid;grid-template-columns:repeat(4,1fr);padding:9px 8px calc(9px + env(safe-area-inset-bottom));z-index:20}.nav button{background:none;border:0;color:#7e8897;display:grid;gap:4px;place-items:center;font-size:11px}.nav button.active{color:#fff}.nav i{font-style:normal;font-size:19px}.hidden{display:none!important}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:9px}.chip{padding:5px 9px;border-radius:999px;background:#19212b;color:#b8c5d5}.error{color:#ff9baa}.success{color:#7de5ad}
</style></head>
<body>
<main class="shell">
<header class="top"><button class="icon" aria-label="المحادثة">◔</button><button class="plus">✦ الحصول على Plus</button><button class="icon" aria-label="القائمة">☰</button></header>
<section class="hero"><h1>ماذا تريد أن أنفّذ؟</h1><p>اكتب المهمة كما تقولها لشخص يعمل أمام الكمبيوتر. سأخطط، أتصفح، وأنفذ، ثم أتحقق من النتيجة.</p></section>
<section class="card">
<div class="label">المهمة</div>
<textarea id="prompt" class="taskbox" placeholder="مثال: افتح موقعاً عاماً، ابحث عن ثلاث نتائج، ثم لخصها في نقاط."></textarea>
<div class="row" style="margin-top:10px"><input id="budget" class="budget" type="number" min="0.05" step="0.05" value="0.75" aria-label="ميزانية المهمة"><button id="run" class="primary" style="margin-top:0;flex:1">بدء التنفيذ ↗</button></div>
<div class="meta"><span>ميزانية قصوى للمهمة</span><span class="chip">تسعير حسب الاستهلاك</span></div>
</section>

<section id="card" class="card live hidden">
<div class="live-head"><strong>التنفيذ المباشر</strong><span class="status"><span id="dot" class="dot"></span><span id="status">في الانتظار</span></span></div>
<div class="screen-wrap"><img id="screen" class="screen" alt="المتصفح المباشر"><div id="screenEmpty" class="screen-empty">بانتظار بدء المتصفح…</div></div>
<div class="timeline" id="timeline"></div>
<div id="handoff" class="warn hidden"><strong>تحتاج المهمة إلى تدخلك.</strong><br><span id="handoffText">أكمل تسجيل الدخول أو التحقق في نافذة المتصفح، ثم اضغط متابعة.</span></div>
<div id="result" class="result hidden"></div>
<div class="row" style="padding:0 16px 16px"><button id="resume" class="primary hidden">متابعة المهمة</button><button id="cancel" class="ghost">إلغاء</button></div>
</section>
</main>
<nav class="nav"><button class="active"><i>⌂</i>الرئيسية</button><button><i>◷</i>المهام</button><button><i>◌</i>النشاط</button><button><i>⚙</i>الإعدادات</button></nav>
<script src="/web/app.js"></script>
</body></html>
