name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      run_live_gemini:
        description: "Run the paid live Gemini smoke test"
        required: true
        default: false
        type: boolean
  issue_comment:
    types: [created]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m compileall server tests
      - run: pytest -q
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Live Gemini Computer Use smoke test (manual only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live_gemini == true && (env.GOOGLE_API_KEY != '' || env.GEMINI_API_KEY != '') }}
        run: python tests/smoke_gemini.py

  android:
    runs-on: ubuntu-latest
    steps:
      - name: Run actions/checkout@v4
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Inspect preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          ls -1 "$ANDROID_HOME/platforms" | tail -n 10 || true
          ls -1 "$ANDROID_HOME/build-tools" | tail -n 10 || true

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build Android PoC
        working-directory: mobile-android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload installable Android APK
        uses: actions/upload-artifact@v4
        with:
          name: omni-mobile-agent-debug-apk
          path: mobile-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Enable KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android install and launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          working-directory: ./mobile-android
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          enable-hw-keyboard: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.agi.omni/.MainActivity
            sleep 5
            adb shell pidof com.agi.omni
            adb shell dumpsys activity activities | grep -E "com\.agi\.omni/.MainActivity|com\.agi\.omni"
