name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  issue_comment:
    types: [created]

jobs:
  test:
    if: ${{ github.event_name != 'issue_comment' || (github.event.comment.body == '/test-live' && github.event.issue.pull_request) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m compileall server tests
      - run: pytest -q
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Live Gemini Computer Use smoke test
        if: ${{ secrets.GOOGLE_API_KEY != '' || secrets.GEMINI_API_KEY != '' }}
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python tests/smoke_gemini.py
