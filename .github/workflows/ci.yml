name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  issue_comment:
    types: [created]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m compileall server tests
      - run: pytest -q
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Live Gemini Computer Use smoke test
        if: ${{ env.GOOGLE_API_KEY != '' || env.GEMINI_API_KEY != '' }}
        run: python tests/smoke_gemini.py

  android:
    runs-on: ubuntu-latest
    steps:
      - name: Run actions/checkout@v4
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build Android PoC
        working-directory: mobile-android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
